<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Dashboard Pro UI</title>

<style>
body {
  margin: 0;
  font-family: system-ui;
  color: #fff;
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  transition: 0.4s;

  /* 透明度制御用 */
  --overlay-opacity: 0.75;
  --card-opacity: 0.85;
}

/* 背景暗さ */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(10,12,18,var(--overlay-opacity));
  z-index: -1;
}

/* UI */
.container {
  padding: 20px;
}

.card {
  background: rgba(22,26,34,var(--card-opacity));
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 10px;
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.08);
}

/* ===== 設定ボタン ===== */
.settings-btn {
  position: fixed;
  bottom: 15px;
  right: 15px;
  background: rgba(0,0,0,0.7);
  border-radius: 10px;
  padding: 10px;
  cursor: pointer;
}

/* ===== スライドメニュー ===== */
.panel {
  position: fixed;
  top: 0;
  right: -320px;
  width: 280px;
  height: 100%;
  background: rgba(0,0,0,0.92);
  padding: 15px;
  transition: 0.35s;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
}

.panel.open {
  right: 0;
}

.section {
  margin-top: 10px;
  font-size: 12px;
  opacity: 0.7;
}

button {
  padding: 6px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  color: #fff;
  background: rgba(255,255,255,0.1);
}

/* スライダー */
input[type="range"] {
  width: 100%;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">重力イベント：03:21</div>
  <div class="card">スカイリッパー：05:10</div>
</div>

<!-- 設定ボタン -->
<div class="settings-btn" onclick="togglePanel()">⚙</div>

<!-- スライドパネル -->
<div class="panel" id="panel">

  <div class="section">テーマ</div>
  <button onclick="setTheme('dark')">Dark</button>
  <button onclick="setTheme('cyber')">Cyber</button>
  <button onclick="setTheme('nature')">Nature</button>

  <div class="section">背景カスタム</div>
  <input id="bgUrl" placeholder="画像URL">
  <button onclick="setCustomBg()">適用</button>

  <div class="section">透明度（背景）</div>
  <input type="range" min="0.3" max="0.9" step="0.01"
    oninput="setOverlay(this.value)">

  <div class="section">透明度（カード）</div>
  <input type="range" min="0.3" max="1" step="0.01"
    oninput="setCard(this.value)">

</div>

<script>

// ===== テーマ =====
const themes = {
  dark: {
    bg: "",
    overlay: 0.75,
    card: 0.85
  },
  cyber: {
    bg: "https://images.unsplash.com/photo-1550751827-4bd374c3f58b",
    overlay: 0.6,
    card: 0.9
  },
  nature: {
    bg: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee",
    overlay: 0.55,
    card: 0.8
  }
};

// ===== パネル =====
function togglePanel(){
  document.getElementById("panel").classList.toggle("open");
}

// ===== テーマ適用 =====
function setTheme(name){

  const t = themes[name];

  if(t.bg){
    document.body.style.backgroundImage = `url('${t.bg}')`;
  } else {
    document.body.style.backgroundImage = "none";
  }

  setOverlay(t.overlay);
  setCard(t.card);

  localStorage.setItem("theme", name);
}

// ===== 背景カスタム =====
function setCustomBg(){
  const url = document.getElementById("bgUrl").value;
  document.body.style.backgroundImage = `url('${url}')`;
  localStorage.setItem("bg", url);
}

// ===== 透明度 =====
function setOverlay(v){
  document.documentElement.style.setProperty("--overlay-opacity", v);
  localStorage.setItem("overlay", v);
}

function setCard(v){
  document.documentElement.style.setProperty("--card-opacity", v);
  localStorage.setItem("card", v);
}

// ===== 復元 =====
(function init(){

  const theme = localStorage.getItem("theme") || "dark";
  setTheme(theme);

  const bg = localStorage.getItem("bg");
  if(bg){
    document.body.style.backgroundImage = `url('${bg}')`;
  }

  const overlay = localStorage.getItem("overlay");
  if(overlay) setOverlay(overlay);

  const card = localStorage.getItem("card");
  if(card) setCard(card);

})();

</script>

</body>
</html>
