<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Once Human HUD</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  color:#fff;
  background-size:cover;
  background-position:center;
  background-attachment:fixed;

  --overlay:0.75;
  --brightness:1;
}

/* 背景 */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,var(--overlay));
  z-index:-1;
  filter:brightness(var(--brightness));
}

/* レイアウト */
.container{
  display:flex;
  gap:12px;
  padding:18px;
}

/* カード */
.card{
  background:rgba(20,24,32,0.85);
  border-radius:12px;
  padding:14px;
  margin-bottom:10px;
  position:relative;
  overflow:hidden;
}

/* 波紋 */
.ripple{
  position:absolute;
  top:50%;
  left:50%;
  width:10px;
  height:10px;
  background:rgba(255,255,255,0.08);
  border-radius:50%;
  transform:translate(-50%,-50%);
  animation:ripple 4s infinite;
}

@keyframes ripple{
  0%{width:10px;height:10px;opacity:.4}
  100%{width:450px;height:450px;opacity:0}
}

/* タイマー強調 */
.big{
  transform:scale(1.05);
  border:1px solid #ffd700;
}

/* カウンターMAX */
.max{
  box-shadow:0 0 18px rgba(255,215,0,0.6);
  border:1px solid #ffd700;
  animation:glow 1.5s infinite;
}

@keyframes glow{
  0%,100%{box-shadow:0 0 10px rgba(255,215,0,.3)}
  50%{box-shadow:0 0 20px rgba(255,215,0,.8)}
}

/* アラート */
.alert{
  animation:blink .5s infinite;
}

@keyframes blink{
  0%,100%{opacity:1}
  50%{opacity:.3}
}

/* 設定 */
.settings{
  position:fixed;
  right:15px;
  bottom:15px;
  padding:10px;
  background:rgba(0,0,0,.7);
  border-radius:10px;
  cursor:pointer;
}

.panel{
  position:fixed;
  top:0;
  right:-340px;
  width:300px;
  height:100%;
  background:rgba(0,0,0,.92);
  padding:15px;
  transition:.3s;
  overflow:auto;
}

.panel.open{right:0}

.section{
  font-size:12px;
  opacity:.7;
  margin-top:10px;
}

input{
  width:100%;
  margin-top:6px;
}
</style>
</head>

<body>

<div class="container">

  <!-- タイマー -->
  <div style="flex:1">

    <div id="timerList"></div>

  </div>

  <!-- カウンター -->
  <div style="flex:1">

    <div class="card" id="hunting">
      空域ハンティング <span id="h1">0</span>/12
      <button onclick="add('h1',12)">＋</button>
      <button onclick="sub('h1')">−</button>
    </div>

    <div class="card" id="relic">
      スカイリッパー遺物 <span id="r1">0</span>/10
      <button onclick="add('r1',10)">＋</button>
      <button onclick="sub('r1')">−</button>
    </div>

    <div class="card" id="star">
      スターコーリング <span id="s1">0</span>/5
      <button onclick="add('s1',5)">＋</button>
      <button onclick="sub('s1')">−</button>
    </div>

  </div>

</div>

<!-- 設定 -->
<div class="settings" onclick="toggle()">⚙</div>

<div class="panel" id="panel">

  <button onclick="toggle()">← 戻る</button>

  <div class="section">背景URL</div>
  <input id="bg">
  <button onclick="setBg()">適用</button>

  <div class="section">ローカル背景</div>
  <input type="file" onchange="local(event)">

  <div class="section">透明度</div>
  <input type="range" min="0.3" max="0.9" step="0.01"
    oninput="setOpacity(this.value)">

  <div class="section">明るさ</div>
  <input type="range" min="0.5" max="1.5" step="0.01"
    oninput="setBright(this.value)">

</div>

<script>

/* ===== カウンター ===== */
const max={h1:12,r1:10,s1:5};
const val={h1:0,r1:0,s1:0};

function add(k,m){
  if(val[k]<m) val[k]++;
  update();
}

function sub(k){
  if(val[k]>0) val[k]--;
  update();
}

function update(){

  for(let k in val){

    const el=document.getElementById(k);
    const card=el.parentElement;

    el.innerText=val[k];

    if(val[k]==max[k]){
      card.classList.add("max");
    }else{
      card.classList.remove("max");
    }
  }
}

/* ===== タイマー ===== */
const events=[
 {name:"重力開始",m:22,s:30},
 {name:"スカイリッパー開始",m:37,s:30},
 {name:"重力終了",m:52,s:30},
 {name:"スカイリッパー終了",m:57,s:30}
];

function calc(){
  const now=new Date();

  let list=events.map(e=>{
    let t=new Date();
    t.setHours(now.getHours(),e.m,e.s,0);
    if(now>t) t.setDate(t.getDate()+1);

    let diff=t-now;

    return {
      name:e.name,
      diff,
      sec:Math.floor(diff/1000)
    };
  });

  list.sort((a,b)=>a.diff-b.diff);

  render(list);
}

function render(list){

  const box=document.getElementById("timerList");
  box.innerHTML="";

  list.forEach((e,i)=>{

    let m=Math.floor(e.sec/60);
    let s=e.sec%60;

    let div=document.createElement("div");
    div.className="card";

    if(i===0) div.classList.add("big");

    if(e.sec<60) div.classList.add("alert");

    div.innerHTML=`
      <div class="ripple"></div>
      <div>
        ${e.name}
        <div>${m}:${s.toString().padStart(2,"0")}</div>
      </div>
    `;

    box.appendChild(div);
  });
}

setInterval(calc,1000);
calc();

/* ===== 設定 ===== */
function toggle(){
  document.getElementById("panel").classList.toggle("open");
}

function setBg(){
  document.body.style.backgroundImage=
    `url('${document.getElementById("bg").value}')`;
}

function local(e){
  const f=e.target.files[0];
  const r=new FileReader();
  r.onload=ev=>{
    document.body.style.backgroundImage=
      `url('${ev.target.result}')`;
  };
  r.readAsDataURL(f);
}

function setOpacity(v){
  document.documentElement.style.setProperty("--overlay",v);
}

function setBright(v){
  document.documentElement.style.setProperty("--brightness",v);
}

</script>

</body>
</html>
