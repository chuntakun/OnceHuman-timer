<script>

function nextMinuteTarget(targetMinute){

    const now = new Date();

    let target = new Date();

    target.setMinutes(targetMinute);
    target.setSeconds(30);
    target.setMilliseconds(0);

    if(target <= now){
        target.setHours(target.getHours()+1);
    }

    return target;
}

function formatCountdown(diff){

    const total = Math.floor(diff / 1000);

    const m = Math.floor(total / 60);
    const s = total % 60;

    return String(m).padStart(2,'0') +
           ":" +
           String(s).padStart(2,'0');
}

function update(){

    const now = new Date();

    const gravityStart =
        nextMinuteTarget(22);

    const ripperStart =
        nextMinuteTarget(37);

    const gravityEnd =
        nextMinuteTarget(52);

    document.getElementById(
        "gravityStart"
    ).textContent =
        formatCountdown(
            gravityStart - now
        );

    document.getElementById(
        "ripperStart"
    ).textContent =
        formatCountdown(
            ripperStart - now
        );

    document.getElementById(
        "gravityEnd"
    ).textContent =
        formatCountdown(
            gravityEnd - now
        );

    document.getElementById(
        "gravityStartNext"
    ).textContent =
        "次回 " +
        gravityStart.toLocaleTimeString(
            "ja-JP",
            {
                hour:'2-digit',
                minute:'2-digit',
                second:'2-digit'
            }
        );

    document.getElementById(
        "ripperStartNext"
    ).textContent =
        "次回 " +
        ripperStart.toLocaleTimeString(
            "ja-JP",
            {
                hour:'2-digit',
                minute:'2-digit',
                second:'2-digit'
            }
        );

    document.getElementById(
        "gravityEndNext"
    ).textContent =
        "次回 " +
        gravityEnd.toLocaleTimeString(
            "ja-JP",
            {
                hour:'2-digit',
                minute:'2-digit',
                second:'2-digit'
            }
        );
}

update();

setInterval(
    update,
    1000
);

</script>
