<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Theme Dashboard</title>

<style>
body {
  margin: 0;
  font-family: system-ui;
  color: #fff;
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  transition: 0.4s;
}

/* オーバーレイ */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: var(--overlay, rgba(10,12,18,0.75));
  z-index: -1;
  transition: 0.4s;
}

.container {
  padding: 20px;
}

.card {
  background: var(--card, rgba(22,26,34,0.85));
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 10px;
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.08);
  transition: 0.4s;
}

/* テーマパネル */
.panel {
  position: fixed;
  bottom: 10px;
  right: 10px;
  background: rgba(0,0,0,0.6);
  padding: 10px;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

button {
  cursor: pointer;
  border: none;
  padding: 6px;
  border-radius: 6px;
  color: #fff;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">重力イベント：03:21</div>
  <div class="card">スカイリッパー：05:10</div>
</div>

<!-- テーマUI -->
<div class="panel">
  <button onclick="setTheme('dark')">Dark</button>
  <button onclick="setTheme('cyber')">Cyber</button>
  <button onclick="setTheme('nature')">Nature</button>
</div>

<script>

// ===== テーマ定義 =====
const themes = {

  dark: {
    bg: "",
    overlay: "rgba(10,12,18,0.75)",
    card: "rgba(22,26,34,0.85)"
  },

  cyber: {
    bg: "https://images.unsplash.com/photo-1550751827-4bd374c3f58b",
    overlay: "rgba(0,0,0,0.65)",
    card: "rgba(10,15,25,0.9)"
  },

  nature: {
    bg: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee",
    overlay: "rgba(0,0,0,0.55)",
    card: "rgba(20,30,20,0.85)"
  }
};

// ===== テーマ適用 =====
function setTheme(name){

  const t = themes[name];

  if(!t) return;

  if(t.bg){
    document.body.style.backgroundImage = `url('${t.bg}')`;
  } else {
    document.body.style.backgroundImage = "none";
    document.body.style.backgroundColor = "#0d0f14";
  }

  document.documentElement.style.setProperty("--overlay", t.overlay);
  document.documentElement.style.setProperty("--card", t.card);

  localStorage.setItem("theme", name);
}

// ===== 復元 =====
const saved = localStorage.getItem("theme") || "dark";
setTheme(saved);

</script>

</body>
</html>
