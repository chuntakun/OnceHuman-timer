<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>GRAVITY ABYSS</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  color:#e8f6ff;
  background-size:cover;
  background-position:center;
  background-attachment:fixed;

  --overlay:0.6;
}

/* 背景オーバーレイ */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,var(--overlay));
  z-index:-1;
}

/* ヘッダー */
.header{
  text-align:center;
  padding:14px 0 6px;
}

.header h1{
  margin:0;
  letter-spacing:3px;
}

.header h2{
  margin:4px 0 0;
  font-size:12px;
  opacity:.6;
}

/* レイアウト */
.container{
  display:flex;
  gap:12px;
  padding:16px;
}

/* メイン */
#mainTimer{
  margin-bottom:10px;
}

/* カード */
.card{
  background:rgba(15,18,25,0.72);
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
  position:relative;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.08);
  transition:.2s;
}

/* 波紋 */
.ripple{
  position:absolute;
  top:50%;
  left:50%;
  width:10px;
  height:10px;
  background:rgba(180,220,255,0.08);
  border-radius:50%;
  transform:translate(-50%,-50%);
  animation:ripple 4s infinite;
}

@keyframes ripple{
  0%{width:10px;height:10px;opacity:.4}
  100%{width:460px;height:460px;opacity:0}
}

/* メイン強調 */
.big{
  transform:scale(1.03);
  border:1px solid rgba(160,220,255,0.4);
}

/* 近接 */
.hot{
  border:1px solid rgba(120,200,255,0.3);
}

/* カウンターMAX */
.max{
  border:1px solid rgba(120,200,255,0.6);
  box-shadow:0 0 14px rgba(120,200,255,0.2);
}

/* 横スクロール */
#subTimers{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:6px;
}

/* サブカード */
.sub{
  min-width:160px;
  opacity:.75;
}

/* カウンター */
#counters{
  display:flex;
  gap:10px;
  margin-top:14px;
}

.settings{
  position:fixed;
  right:14px;
  bottom:14px;
  padding:10px;
  background:rgba(0,0,0,0.45);
  border-radius:10px;
  cursor:pointer;
  border:1px solid rgba(120,200,255,0.2);
}

.panel{
  position:fixed;
  top:0;
  right:-340px;
  width:300px;
  height:100%;
  background:rgba(0,0,0,0.92);
  padding:15px;
  transition:.3s;
}

.panel.open{right:0}

input{
  width:100%;
  margin-top:6px;
}

button{
  background:rgba(120,200,255,0.1);
  color:#e8f6ff;
  border:1px solid rgba(120,200,255,0.2);
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
}

/* ===== ワープ演出 ===== */
.warp-out{
  animation:warpOut .25s forwards;
}

.warp-in{
  animation:warpIn .35s forwards;
}

@keyframes warpOut{
  0%{transform:scale(1) rotate(0);opacity:1;filter:blur(0)}
  100%{transform:scale(0.6) rotate(6deg);opacity:0;filter:blur(6px)}
}

@keyframes warpIn{
  0%{transform:scale(1.3) rotate(-6deg);opacity:0;filter:blur(8px)}
  100%{transform:scale(1) rotate(0);opacity:1;filter:blur(0)}
}
</style>
</head>

<body>

<div class="header">
  <h1>ONCE HUMAN</h1>
  <h2>GRAVITY ABYSS</h2>
</div>

<div class="container">

  <div style="flex:1">

    <div id="mainTimer"></div>
    <div id="subTimers"></div>

    <div id="counters"></div>

  </div>

</div>

<div class="settings" onclick="toggle()">⚙</div>

<div class="panel" id="panel">

  <button onclick="toggle()">戻る</button>

  <div>背景URL</div>
  <input id="bg">
  <button onclick="setBg()">適用</button>

  <div>透明度</div>
  <input type="range" min="0.3" max="0.9" step="0.01"
    oninput="setOpacity(this.value)">

</div>

<script>

/* ===== データ ===== */
const events=[
 {name:"重力開始",m:22,s:30},
 {name:"スカイリッパー開始",m:37,s:30},
 {name:"重力終了",m:52,s:30},
 {name:"スカイリッパー終了",m:57,s:30}
];

const max={v1:12,v2:10,v3:5};
const val={v1:0,v2:0,v3:0};

let prevMain=null;

/* ===== 次時間（毎時ループ） ===== */
function next(m,s){
  const now=new Date();
  const t=new Date();
  t.setHours(now.getHours(),m,s,0);
  if(now>t) t.setHours(now.getHours()+1);
  return t;
}

/* ===== タイマー ===== */
function calc(){

  const now=new Date();

  let list=events.map(e=>{

    const t=next(e.m,e.s);
    const diff=t-now;

    return{
      name:e.name,
      sec:Math.floor(diff/1000),
      diff
    };
  });

  list.sort((a,b)=>a.diff-b.diff);

  render(list);
}

function render(list){

  const mainBox=document.getElementById("mainTimer");
  const subBox=document.getElementById("subTimers");

  const main=list[0];
  const sub=list.slice(1);

  const changed=!prevMain || prevMain.name!==main.name;

  const m=Math.floor(main.sec/60);
  const s=main.sec%60;

  const newMain=document.createElement("div");
  newMain.className="card big";
  newMain.style.textAlign="center";

  newMain.innerHTML=`
    <div class="ripple"></div>
    <div>${main.name}</div>
    <div style="font-size:36px;margin-top:6px">
      ${m}:${s.toString().padStart(2,"0")}
    </div>
  `;

  if(changed && mainBox.firstChild){

    const old=mainBox.firstChild;
    old.classList.add("warp-out");

    setTimeout(()=>{
      mainBox.innerHTML="";
      newMain.classList.add("warp-in");
      mainBox.appendChild(newMain);
    },220);

  } else {
    mainBox.innerHTML="";
    mainBox.appendChild(newMain);
  }

  prevMain=main;

  subBox.innerHTML="";

  sub.forEach(e=>{

    const m=Math.floor(e.sec/60);
    const s=e.sec%60;

    const div=document.createElement("div");
    div.className="card sub";

    if(e.sec<120) div.classList.add("hot");

    div.innerHTML=`
      <div class="ripple"></div>
      <div>${e.name}</div>
      <div>${m}:${s.toString().padStart(2,"0")}</div>
    `;

    subBox.appendChild(div);
  });

  updateCountersUI();
}

/* ===== カウンター ===== */
function add(k,m){
  if(val[k]<m) val[k]++;
  updateCountersUI();
}

function sub(k){
  if(val[k]>0) val[k]--;
  updateCountersUI();
}

function updateCountersUI(){

  const box=document.getElementById("counters");
  box.innerHTML="";

  const items=[
    {id:"v1",name:"空域",max:12},
    {id:"v2",name:"スカイリッパー",max:10},
    {id:"v3",name:"スター",max:5}
  ];

  items.forEach(i=>{

    const div=document.createElement("div");
    div.className="card";
    div.style.flex="1";
    div.style.textAlign="center";

    div.innerHTML=`
      <div>${i.name}</div>
      <div style="font-size:22px">${val[i.id]}/${i.max}</div>
      <div>
        <button onclick="add('${i.id}',${i.max})">＋</button>
        <button onclick="sub('${i.id}')">−</button>
      </div>
    `;

    box.appendChild(div);
  });
}

/* ===== 設定 ===== */
function toggle(){
  document.getElementById("panel").classList.toggle("open");
}

function setBg(){
  document.body.style.backgroundImage=
    `url('${document.getElementById("bg").value}')`;
}

function setOpacity(v){
  document.documentElement.style.setProperty("--overlay",v);
}

/* ===== 起動 ===== */
setInterval(calc,1000);
calc();

</script>

</body>
</html>
