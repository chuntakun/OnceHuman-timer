<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Dashboard Settings UI</title>

<style>
body {
  margin: 0;
  font-family: system-ui;
  color: #fff;
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  transition: 0.4s;
}

/* オーバーレイ */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: var(--overlay, rgba(10,12,18,0.75));
  z-index: -1;
}

/* カード */
.container {
  padding: 20px;
}

.card {
  background: var(--card, rgba(22,26,34,0.85));
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 10px;
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.08);
}

/* ===== 設定ボタン ===== */
.settings-btn {
  position: fixed;
  bottom: 15px;
  right: 15px;
  background: rgba(0,0,0,0.7);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 10px 12px;
  border-radius: 10px;
  cursor: pointer;
}

/* ===== 設定パネル ===== */
.panel {
  position: fixed;
  right: 15px;
  bottom: 60px;
  width: 220px;
  background: rgba(0,0,0,0.85);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 10px;
  display: none;
  flex-direction: column;
  gap: 8px;
}

.panel.show {
  display: flex;
}

button {
  padding: 6px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  color: #fff;
  background: rgba(255,255,255,0.1);
}

button:hover {
  background: rgba(255,255,255,0.2);
}

.section-title {
  font-size: 12px;
  opacity: 0.7;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">重力イベント：03:21</div>
  <div class="card">スカイリッパー：05:10</div>
</div>

<!-- 設定ボタン -->
<div class="settings-btn" onclick="togglePanel()">⚙ 設定</div>

<!-- 設定パネル -->
<div class="panel" id="panel">

  <div class="section-title">テーマ</div>
  <button onclick="setTheme('dark')">Dark</button>
  <button onclick="setTheme('cyber')">Cyber</button>
  <button onclick="setTheme('nature')">Nature</button>

</div>

<script>

// ===== テーマ =====
const themes = {

  dark: {
    bg: "",
    overlay: "rgba(10,12,18,0.75)",
    card: "rgba(22,26,34,0.85)"
  },

  cyber: {
    bg: "https://images.unsplash.com/photo-1550751827-4bd374c3f58b",
    overlay: "rgba(0,0,0,0.65)",
    card: "rgba(10,15,25,0.9)"
  },

  nature: {
    bg: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee",
    overlay: "rgba(0,0,0,0.55)",
    card: "rgba(20,30,20,0.85)"
  }
};

// ===== パネル開閉 =====
function togglePanel(){
  document.getElementById("panel").classList.toggle("show");
}

// ===== テーマ適用 =====
function setTheme(name){

  const t = themes[name];

  if(t.bg){
    document.body.style.backgroundImage = `url('${t.bg}')`;
  } else {
    document.body.style.backgroundImage = "none";
  }

  document.documentElement.style.setProperty("--overlay", t.overlay);
  document.documentElement.style.setProperty("--card", t.card);

  localStorage.setItem("theme", name);
}

// ===== 復元 =====
setTheme(localStorage.getItem("theme") || "dark");

</script>

</body>
</html>
