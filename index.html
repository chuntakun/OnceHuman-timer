<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>GRAVITY ABYSS</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  color:#e8f6ff;
  background-size:cover;
  background-position:center;
  background-attachment:fixed;

  --overlay:0.6;
  --brightness:1;
}

/* 背景レイヤー */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,var(--overlay));
  z-index:-1;
  transition:filter .2s ease;
}

/* ヘッダー */
.header{
  text-align:center;
  padding:16px 0 6px;
}

.header h1{
  margin:0;
  letter-spacing:3px;
  font-weight:600;
}

.header h2{
  margin:4px 0 0;
  font-size:12px;
  opacity:.6;
  letter-spacing:2px;
}

/* レイアウト */
.container{
  display:flex;
  gap:12px;
  padding:18px;
}

/* カード */
.card{
  background:rgba(15,18,25,0.72);
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
  position:relative;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.08);
  transition:.25s;
}

/* 波紋 */
.ripple{
  position:absolute;
  top:50%;
  left:50%;
  width:10px;
  height:10px;
  background:rgba(180,220,255,0.08);
  border-radius:50%;
  transform:translate(-50%,-50%);
  animation:ripple 4s infinite;
}

@keyframes ripple{
  0%{width:10px;height:10px;opacity:.4}
  100%{width:460px;height:460px;opacity:0}
}

/* 一番近い */
.big{
  transform:scale(1.03);
  border:1px solid rgba(160,220,255,0.5);
  box-shadow:0 0 14px rgba(160,220,255,0.25);
}

/* 近い状態 */
.hot{
  border:1px solid rgba(120,200,255,0.35);
  box-shadow:0 0 14px rgba(120,200,255,0.2);
}

/* カウンターMAX */
.max{
  border:1px solid rgba(120,200,255,0.7);
  box-shadow:0 0 18px rgba(120,200,255,0.3);
}

/* 設定ボタン */
.settings{
  position:fixed;
  right:15px;
  bottom:15px;
  padding:10px;
  background:rgba(0,0,0,0.45);
  border:1px solid rgba(120,200,255,0.2);
  border-radius:10px;
  cursor:pointer;
}

/* パネル */
.panel{
  position:fixed;
  top:0;
  right:-340px;
  width:300px;
  height:100%;
  background:rgba(0,0,0,0.92);
  padding:15px;
  transition:.3s;
  overflow:auto;
}

.panel.open{right:0}

.section{
  font-size:12px;
  opacity:.7;
  margin-top:10px;
}

input{
  width:100%;
  margin-top:6px;
  background:rgba(0,0,0,0.2);
  color:#fff;
  border:1px solid rgba(120,200,255,0.15);
}

button{
  background:rgba(120,200,255,0.1);
  border:1px solid rgba(120,200,255,0.2);
  color:#e8f6ff;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
  <h1>ONCE HUMAN</h1>
  <h2>GRAVITY ABYSS</h2>
</div>

<div class="container">

  <div style="flex:1" id="timerList"></div>

  <div style="flex:1">

    <div class="card" id="h1">
      空域ハンティング <span id="v1">0</span>/12
      <button onclick="add('v1',12)">＋</button>
      <button onclick="sub('v1')">−</button>
    </div>

    <div class="card" id="r1">
      スカイリッパー遺物 <span id="v2">0</span>/10
      <button onclick="add('v2',10)">＋</button>
      <button onclick="sub('v2')">−</button>
    </div>

    <div class="card" id="s1">
      スターコーリング <span id="v3">0</span>/5
      <button onclick="add('v3',5)">＋</button>
      <button onclick="sub('v3')">−</button>
    </div>

  </div>
</div>

<div class="settings" onclick="toggle()">⚙</div>

<div class="panel" id="panel">

  <button onclick="toggle()">戻る</button>

  <div class="section">背景URL</div>
  <input id="bg">
  <button onclick="setBg()">適用</button>

  <div class="section">ランダム背景</div>
  <button onclick="randomBg()">ランダム</button>

  <div class="section">ローカル背景</div>
  <input type="file" onchange="local(event)">

  <div class="section">透明度</div>
  <input type="range" min="0.3" max="0.9" step="0.01"
    oninput="setOpacity(this.value)">

  <div class="section">明るさ</div>
  <input type="range" min="0.6" max="1.4" step="0.01"
    oninput="setBright(this.value)">

</div>

<script>

/* ===== 背景 ===== */
const backgrounds=[
"https://images.unsplash.com/photo-1446776811953-b23d57bd21aa",
"https://images.unsplash.com/photo-1451187580459-43490279c0fa",
"https://images.unsplash.com/photo-1462331940025-496dfbfc7564",
"https://images.unsplash.com/photo-1473929733910-ef9d7cc40c36"
];

function randomBg(){
  const url=backgrounds[Math.floor(Math.random()*backgrounds.length)];
  document.body.style.backgroundImage=`url('${url}')`;
}

/* ===== カウンター ===== */
const max={v1:12,v2:10,v3:5};
const val={v1:0,v2:0,v3:0};

function add(k,m){
  if(val[k]<m) val[k]++;
  update();
}

function sub(k){
  if(val[k]>0) val[k]--;
  update();
}

function update(){
  for(let k in val){
    const el=document.getElementById(k);
    el.innerText=val[k];

    const card=el.parentElement;

    if(val[k]>=max[k]) card.classList.add("max");
    else card.classList.remove("max");
  }
}

/* ===== タイマー（毎時ループ） ===== */
const events=[
 {name:"重力開始",m:22,s:30},
 {name:"スカイリッパー開始",m:37,s:30},
 {name:"重力終了",m:52,s:30},
 {name:"スカイリッパー終了",m:57,s:30}
];

function next(m,s){
  const now=new Date();
  const t=new Date();
  t.setHours(now.getHours(),m,s,0);
  if(now>t) t.setHours(now.getHours()+1);
  return t;
}

function calc(){

  const now=new Date();

  let list=events.map(e=>{

    const t=next(e.m,e.s);

    const diff=t-now;

    return{
      name:e.name,
      sec:Math.floor(diff/1000),
      diff
    };
  });

  list.sort((a,b)=>a.diff-b.diff);

  render(list);
}

function render(list){

  const box=document.getElementById("timerList");
  box.innerHTML="";

  list.forEach((e,i)=>{

    const m=Math.floor(e.sec/60);
    const s=e.sec%60;

    const div=document.createElement("div");
    div.className="card";

    if(i===0) div.classList.add("big");
    if(e.sec<120) div.classList.add("hot");

    div.innerHTML=`
      <div class="ripple"></div>
      <div>
        ${e.name}
        <div>${m}:${s.toString().padStart(2,"0")}</div>
      </div>
    `;

    box.appendChild(div);
  });
}

setInterval(calc,1000);
calc();

/* ===== 設定 ===== */
function toggle(){
  document.getElementById("panel").classList.toggle("open");
}

function setBg(){
  document.body.style.backgroundImage=
    `url('${document.getElementById("bg").value}')`;
}

function local(e){
  const f=e.target.files[0];
  const r=new FileReader();
  r.onload=ev=>{
    document.body.style.backgroundImage=
      `url('${ev.target.result}')`;
  };
  r.readAsDataURL(f);
}

function setOpacity(v){
  document.documentElement.style.setProperty("--overlay",v);
}

function setBright(v){
  document.documentElement.style.setProperty("--brightness",v);
}

</script>

</body>
</html>
