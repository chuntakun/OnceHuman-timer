<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Once Human Monitor</title>

<style>
body {
  background:#0f0f0f;
  color:#fff;
  font-family:sans-serif;
}

.container {
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:20px;
}

.card {
  background:#1c1c1c;
  padding:15px;
  border-radius:12px;
  font-size:20px;
  transition:0.3s;
  border:1px solid #333;
}

/* WARNING */
.warning {
  border-color: orange;
  box-shadow: 0 0 10px orange;
}

/* URGENT */
.urgent {
  border-color: red;
  box-shadow: 0 0 20px red;
  animation: blink 0.5s infinite alternate;
}

@keyframes blink {
  from { opacity:1; }
  to { opacity:0.4; }
}
</style>
</head>

<body>

<div class="container" id="app"></div>

<script>
// ===== 通知 =====
if ("Notification" in window && Notification.permission !== "granted") {
  Notification.requestPermission();
}

// ===== データ =====
const events = [
  { id:"gravity", name:"重力イベント", cycleSec:180, last:Date.now() },
  { id:"abyss", name:"アビスコア", cycleSec:600, last:Date.now() },
  { id:"daily", name:"デイリー更新", cycleSec:86400, last:Date.now() }
];

// ===== UI生成 =====
const app = document.getElementById("app");

events.forEach(e => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `${e.name}：<span>--:--</span>`;
  e.el = card;
  app.appendChild(card);
});

// ===== 通知制御（1回だけ）=====
function notify(name){
  if(Notification.permission === "granted"){
    new Notification(`${name} が終了`);
  }
}

// ===== 更新処理 =====
function update(){

  const now = Date.now();

  events.forEach(e => {

    const elapsed = Math.floor((now - e.last)/1000);
    const remain = e.cycleSec - (elapsed % e.cycleSec);

    const m = String(Math.floor(remain/60)).padStart(2,"0");
    const s = String(remain%60).padStart(2,"0");

    const el = e.el;
    el.querySelector("span").innerText = `${m}:${s}`;

    // ===== 状態判定 =====
    el.classList.remove("warning","urgent");

    if(remain <= 10){
      el.classList.add("urgent");

      if(!e.notified){
        notify(e.name);
        e.notified = true;
      }

    } else if(remain <= 60){
      el.classList.add("warning");
      e.notified = false;
    } else {
      e.notified = false;
    }

  });
}

setInterval(update, 500);
update();

</script>

</body>
</html>
