<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Once Human Dashboard</title>

<style>
body {
  margin: 0;
  font-family: system-ui;
  color: #fff;
  background-size: cover;
  background-position: center;
  background-attachment: fixed;

  --overlay-opacity: 0.75;
  --card-opacity: 0.85;
}

/* 背景暗さ */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(10,12,18,var(--overlay-opacity));
  z-index: -1;
}

/* 全体 */
.container {
  padding: 20px;
}

/* カード */
.card {
  background: rgba(22,26,34,var(--card-opacity));
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
  border: 1px solid rgba(255,255,255,0.08);
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
  overflow: hidden;
}

/* ===== 波紋（タイマー専用） ===== */
.timer-card .ripple {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 10px;
  height: 10px;
  background: rgba(255,255,255,0.08);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  animation: ripple 4s ease-out infinite;
  z-index: 1;
}

@keyframes ripple {
  0% {
    width: 10px;
    height: 10px;
    opacity: 0.4;
  }
  100% {
    width: 420px;
    height: 420px;
    opacity: 0;
  }
}

/* 中身を前面 */
.content {
  position: relative;
  z-index: 2;
}

/* ボタン */
button {
  padding: 6px 10px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  background: rgba(255,255,255,0.1);
  color: #fff;
}

/* 設定ボタン */
.settings-btn {
  position: fixed;
  right: 15px;
  bottom: 15px;
  padding: 10px;
  background: rgba(0,0,0,0.7);
  border-radius: 10px;
  cursor: pointer;
}

/* パネル */
.panel {
  position: fixed;
  top: 0;
  right: -320px;
  width: 280px;
  height: 100%;
  background: rgba(0,0,0,0.92);
  padding: 15px;
  transition: 0.3s;
  overflow-y: auto;
}

.panel.open {
  right: 0;
}

.section {
  font-size: 12px;
  opacity: 0.7;
  margin-top: 10px;
}

input {
  width: 100%;
  margin-top: 5px;
}

/* カウンター */
.counter-btns button {
  margin-left: 5px;
}
</style>
</head>

<body>

<div class="container">

  <!-- タイマー -->
  <div class="card timer-card">
    <div class="ripple"></div>
    <div class="content">
      重力イベント
      <div id="gravityTimer">--:--</div>
    </div>
  </div>

  <div class="card timer-card">
    <div class="ripple"></div>
    <div class="content">
      スカイリッパー
      <div id="skyTimer">--:--</div>
    </div>
  </div>

  <!-- カウンター -->
  <div class="card" id="huntingCard">
    <div class="content">
      空域ハンティング
      <div id="huntingCount">0 / 12</div>
    </div>
    <div class="counter-btns">
      <button onclick="change('hunting',1)">＋</button>
      <button onclick="change('hunting',-1)">−</button>
    </div>
  </div>

  <div class="card" id="relicCard">
    <div class="content">
      スカイリッパー遺物
      <div id="relicCount">0 / 10</div>
    </div>
    <div class="counter-btns">
      <button onclick="change('relic',1)">＋</button>
      <button onclick="change('relic',-1)">−</button>
    </div>
  </div>

</div>

<!-- 設定 -->
<div class="settings-btn" onclick="togglePanel()">⚙</div>

<div class="panel" id="panel">

  <div class="section">背景URL</div>
  <input id="bgUrl">
  <button onclick="setBg()">適用</button>

  <div class="section">透明度（背景）</div>
  <input type="range" min="0.3" max="0.9" step="0.01"
    oninput="setOverlay(this.value)">

  <div class="section">透明度（カード）</div>
  <input type="range" min="0.3" max="1" step="0.01"
    oninput="setCard(this.value)">

</div>

<script>

/* ======================
   カウンター
====================== */

let state = {
  hunting: 0,
  relic: 0
};

const max = {
  hunting: 12,
  relic: 10
};

function change(type, v){

  state[type] += v;

  if(state[type] < 0) state[type] = 0;
  if(state[type] > max[type]) state[type] = max[type];

  render();
  save();
}

function render(){

  document.getElementById("huntingCount").innerText =
    `${state.hunting} / 12`;

  document.getElementById("relicCount").innerText =
    `${state.relic} / 10`;
}

/* ======================
   タイマー
====================== */

const events = {
  gravity: { m: 22, s: 30 },
  sky: { m: 37, s: 30 }
};

function updateTimer(){

  const now = new Date();

  Object.keys(events).forEach(k=>{

    const e = events[k];

    const target = new Date();
    target.setHours(now.getHours(), e.m, e.s, 0);

    if(now > target){
      target.setDate(target.getDate()+1);
    }

    const diff = Math.floor((target-now)/1000);

    const m = Math.floor(diff/60);
    const s = diff%60;

    const el = document.getElementById(k+"Timer");

    if(el){
      el.innerText = `${m}:${s.toString().padStart(2,"0")}`;
    }
  });
}

setInterval(updateTimer,1000);
updateTimer();

/* ======================
   設定
====================== */

function togglePanel(){
  document.getElementById("panel").classList.toggle("open");
}

function setBg(){
  const url = document.getElementById("bgUrl").value;
  document.body.style.backgroundImage = `url('${url}')`;
}

function setOverlay(v){
  document.documentElement.style.setProperty("--overlay-opacity", v);
}

function setCard(v){
  document.documentElement.style.setProperty("--card-opacity", v);
}

/* ======================
   保存
====================== */

function save(){
  localStorage.setItem("state", JSON.stringify(state));
}

(function init(){

  const s = localStorage.getItem("state");
  if(s) state = JSON.parse(s);

  render();

})();

</script>

</body>
</html>
