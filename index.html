<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body {
  margin: 0;
  font-family: system-ui;
  color: #fff;
  background-size: cover;
  background-position: center;
  background-attachment: fixed;

  --overlay-opacity: 0.75;
  --card-opacity: 0.85;
}

/* 背景暗さ */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(10,12,18,var(--overlay-opacity));
  z-index: -1;
}

/* コンテナ */
.container {
  padding: 20px;
}

/* カード */
.card {
  background: rgba(22,26,34,var(--card-opacity));
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
  border: 1px solid rgba(255,255,255,0.08);
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: 0.3s;
}

/* 状態 */
.max {
  border: 1px solid #facc15;
  box-shadow: 0 0 12px rgba(250,204,21,0.5);
}

.flash {
  animation: flash 0.4s 2;
}

@keyframes flash {
  0% { opacity: 1; }
  50% { opacity: 0.3; }
  100% { opacity: 1; }
}

/* ボタン */
button {
  margin: 2px;
  padding: 6px 10px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  background: rgba(255,255,255,0.1);
  color: #fff;
}

/* 設定ボタン */
.settings-btn {
  position: fixed;
  right: 15px;
  bottom: 15px;
  background: rgba(0,0,0,0.7);
  padding: 10px;
  border-radius: 10px;
  cursor: pointer;
}

/* パネル */
.panel {
  position: fixed;
  top: 0;
  right: -320px;
  width: 280px;
  height: 100%;
  background: rgba(0,0,0,0.92);
  padding: 15px;
  transition: 0.3s;
  overflow-y: auto;
}

.panel.open {
  right: 0;
}

.section {
  margin-top: 10px;
  font-size: 12px;
  opacity: 0.7;
}

input, select {
  width: 100%;
  margin-top: 5px;
}
</style>
</head>

<body>

<div class="container">

  <div class="card" id="huntingCard">
    <div>
      空域ハンティング
      <div id="huntingCount">0 / 12</div>
    </div>
    <div>
      <button onclick="change('hunting',1)">＋</button>
      <button onclick="change('hunting',-1)">−</button>
    </div>
  </div>

  <div class="card" id="relicCard">
    <div>
      スカイリッパー遺物
      <div id="relicCount">0 / 10</div>
    </div>
    <div>
      <button onclick="change('relic',1)">＋</button>
      <button onclick="change('relic',-1)">−</button>
    </div>
  </div>

</div>

<!-- 設定 -->
<div class="settings-btn" onclick="togglePanel()">⚙</div>

<div class="panel" id="panel">

  <div class="section">プリセット</div>
  <select onchange="loadPreset(this.value)" id="presetSelect"></select>
  <button onclick="savePreset()">保存</button>
  <button onclick="createPreset()">＋新規</button>

  <div class="section">背景URL</div>
  <input id="bgUrl">
  <button onclick="setBg()">適用</button>

  <div class="section">透明度</div>
  <input type="range" min="0.3" max="0.9" step="0.01"
    oninput="setOverlay(this.value)">

  <input type="range" min="0.3" max="1" step="0.01"
    oninput="setCard(this.value)">

</div>

<script>

let state = { hunting:0, relic:0 };
let max = { hunting:12, relic:10 };

let presets = {};
let current = "default";

// ===== 初期化 =====
(function init(){

  const s = localStorage.getItem("state");
  if(s) state = JSON.parse(s);

  const p = localStorage.getItem("presets");
  presets = p ? JSON.parse(p) : {
    default:{
      state:{hunting:0,relic:0},
      overlay:0.75,
      card:0.85,
      bg:""
    }
  };

  current = localStorage.getItem("current") || "default";

  applyPreset(current);
  refresh();

})();

// ===== カウンター =====
function change(type, v){

  state[type] += v;

  if(state[type] < 0) state[type] = 0;
  if(state[type] > max[type]) state[type] = max[type];

  save();

  flash(type);
  render();
}

// ===== 表示 =====
function render(){

  document.getElementById("huntingCount").innerText =
    `${state.hunting} / 12`;

  document.getElementById("relicCount").innerText =
    `${state.relic} / 10`;

  updateCard("hunting", state.hunting, 12);
  updateCard("relic", state.relic, 10);
}

// ===== 状態UI =====
function updateCard(type,val,maxv){

  const el = document.getElementById(type+"Card");

  el.classList.remove("max");

  if(val === maxv){
    el.classList.add("max");
  }
}

// ===== フラッシュ =====
function flash(type){

  const el = document.getElementById(type+"Card");

  el.classList.add("flash");

  setTimeout(()=>{
    el.classList.remove("flash");
  },400);
}

// ===== 保存 =====
function save(){
  localStorage.setItem("state", JSON.stringify(state));
}

// ===== パネル =====
function togglePanel(){
  document.getElementById("panel").classList.toggle("open");
}

// ===== 背景 =====
function setBg(){
  const url = document.getElementById("bgUrl").value;
  document.body.style.backgroundImage = `url('${url}')`;
}

// ===== 透明度 =====
function setOverlay(v){
  document.documentElement.style.setProperty("--overlay-opacity", v);
}

function setCard(v){
  document.documentElement.style.setProperty("--card-opacity", v);
}

// ===== プリセット =====
function savePreset(){

  presets[current] = {
    state,
    overlay:getComputedStyle(document.documentElement)
      .getPropertyValue("--overlay-opacity"),
    card:getComputedStyle(document.documentElement)
      .getPropertyValue("--card-opacity"),
    bg:document.body.style.backgroundImage
  };

  localStorage.setItem("presets", JSON.stringify(presets));
}

// ===== 作成 =====
function createPreset(){

  const name = prompt("名前");

  if(!name) return;

  presets[name] = {
    state:{hunting:0,relic:0},
    overlay:0.75,
    card:0.85,
    bg:""
  };

  current = name;
  applyPreset(name);
}

// ===== 読み込み =====
function loadPreset(name){
  applyPreset(name);
}

// ===== 適用 =====
function applyPreset(name){

  const p = presets[name];
  if(!p) return;

  current = name;
  state = p.state;

  document.documentElement.style.setProperty("--overlay-opacity", p.overlay);
  document.documentElement.style.setProperty("--card-opacity", p.card);

  if(p.bg) document.body.style.backgroundImage = p.bg;

  localStorage.setItem("current", name);

  refresh();
}

// ===== UI更新 =====
function refresh(){

  const sel = document.getElementById("presetSelect");
  sel.innerHTML = "";

  Object.keys(presets).forEach(k=>{
    const o = document.createElement("option");
    o.value = k;
    o.textContent = k;
    sel.appendChild(o);
  });

  sel.value = current;

  render();
}

</script>

</body>
</html>
