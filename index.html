<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Timer Panel</title>

<style>
body {
  font-family: sans-serif;
  background: #111;
  color: #fff;
}

.timer {
  border: 2px solid #444;
  padding: 20px;
  margin: 10px;
  font-size: 28px;
  border-radius: 10px;
  transition: 0.3s;
}

/* フラッシュ用 */
.flash {
  border-color: #ff0033;
  box-shadow: 0 0 20px #ff0033;
  animation: blink 0.6s infinite alternate;
}

@keyframes blink {
  from { opacity: 1; }
  to { opacity: 0.4; }
}
</style>
</head>

<body>

<div id="list"></div>

<script>
// ===== 通知許可 =====
if ("Notification" in window && Notification.permission !== "granted") {
  Notification.requestPermission();
}

// ===== タイマー設定（ここ増やせる）=====
const timers = [
  { name: "重力イベント", minutes: 3 },
  { name: "アビスコア", minutes: 10 },
  { name: "デイリー", minutes: 30 }
];

// 初期化
const list = document.getElementById("list");

timers.forEach(t => {
  t.end = Date.now() + t.minutes * 60 * 1000;

  const div = document.createElement("div");
  div.className = "timer";
  div.innerHTML = `${t.name}：<span></span>`;
  t.el = div;
  list.appendChild(div);
});

// ===== 通知関数 =====
function notify(title) {
  if (Notification.permission === "granted") {
    new Notification(title);
  }
}

// ===== 更新処理 =====
function update() {
  const now = Date.now();

  timers.forEach(t => {
    const diff = t.end - now;
    const el = t.el;

    if (diff <= 0) {
      el.querySelector("span").innerText = "00:00";
      return;
    }

    const sec = Math.floor(diff / 1000);
    const m = String(Math.floor(sec / 60)).padStart(2, "0");
    const s = String(sec % 60).padStart(2, "0");

    el.querySelector("span").innerText = `${m}:${s}`;

    // ===== 10秒以下でフラッシュ =====
    if (sec <= 10) {
      el.classList.add("flash");
    } else {
      el.classList.remove("flash");
    }

    // ===== 0秒到達時通知（1回だけ）=====
    if (!t.notified && diff <= 0) {
      t.notified = true;
      notify(`${t.name} 終了！`);
    }
  });
}

setInterval(update, 200);
update();

</script>

</body>
</html>
