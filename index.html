<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body {
  margin: 0;
  font-family: system-ui;
  color: #fff;
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

/* 暗いオーバーレイ */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(10,12,18,0.75);
  z-index: -1;
}

/* UI */
.container {
  padding: 20px;
}

.card {
  background: rgba(22,26,34,0.85);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 10px;
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.08);
}

/* 背景設定パネル */
.panel {
  position: fixed;
  bottom: 10px;
  right: 10px;
  background: rgba(0,0,0,0.6);
  padding: 10px;
  border-radius: 10px;
  font-size: 12px;
}

input {
  width: 200px;
  margin-top: 5px;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">重力イベント：03:21</div>
  <div class="card">スカイリッパー：05:10</div>
</div>

<!-- 背景設定UI -->
<div class="panel">
  <div>背景URL</div>
  <input id="bgUrl" placeholder="画像URLを貼る">
  <button onclick="setBgUrl()">適用</button>

  <hr style="opacity:0.2">

  <div>ローカル画像</div>
  <input type="file" accept="image/*" onchange="setLocalBg(event)">
</div>

<script>

// ===== URL背景 =====
function setBgUrl(){
  const url = document.getElementById("bgUrl").value;
  if(url){
    document.body.style.backgroundImage = `url('${url}')`;
    localStorage.setItem("bg", url);
  }
}

// ===== ローカル画像 =====
function setLocalBg(event){
  const file = event.target.files[0];
  const reader = new FileReader();

  reader.onload = function(e){
    document.body.style.backgroundImage = `url('${e.target.result}')`;
    localStorage.setItem("bg", e.target.result);
  };

  reader.readAsDataURL(file);
}

// ===== 復元 =====
const saved = localStorage.getItem("bg");
if(saved){
  document.body.style.backgroundImage = `url('${saved}')`;
}

</script>

</body>
</html>
