<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>GRAVITY ABYSS</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  color:#dff6ff;
  background-size:cover;
  background-position:center;
  background-attachment:fixed;

  --overlay:0.75;
  --brightness:1;
}

/* 背景暗さ（青系） */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,20,40,var(--overlay));
  z-index:-1;
  filter:brightness(var(--brightness));
}

/* ヘッダー */
.header{
  text-align:center;
  padding:18px 0 5px;
}

.header h1{
  margin:0;
  letter-spacing:3px;
  font-weight:600;
}

.header h2{
  margin:5px 0 0;
  font-size:12px;
  opacity:.6;
  letter-spacing:2px;
}

/* レイアウト */
.container{
  display:flex;
  gap:12px;
  padding:18px;
}

/* カード */
.card{
  background:rgba(10,25,45,0.7);
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
  position:relative;
  overflow:hidden;
  border:1px solid rgba(120,200,255,0.15);
  transition:.3s;
}

/* 波紋（青系） */
.ripple{
  position:absolute;
  top:50%;
  left:50%;
  width:10px;
  height:10px;
  background:rgba(120,200,255,0.15);
  border-radius:50%;
  transform:translate(-50%,-50%);
  animation:ripple 4s infinite;
}

@keyframes ripple{
  0%{width:10px;height:10px;opacity:.5}
  100%{width:460px;height:460px;opacity:0}
}

/* 一番近いタイマー */
.big{
  transform:scale(1.04);
  border:1px solid rgba(120,220,255,0.8);
  box-shadow:0 0 18px rgba(120,220,255,0.3);
}

/* 近接アラート（青発光） */
.hot{
  border:1px solid rgba(0,200,255,0.8);
  box-shadow:0 0 18px rgba(0,200,255,0.4);
}

/* カウンターMAX */
.max{
  border:1px solid rgba(0,200,255,0.9);
  box-shadow:0 0 20px rgba(0,200,255,0.5);
}

/* 設定 */
.settings{
  position:fixed;
  right:15px;
  bottom:15px;
  padding:10px;
  background:rgba(0,0,0,0.4);
  border-radius:10px;
  cursor:pointer;
  border:1px solid rgba(120,200,255,0.2);
}

.panel{
  position:fixed;
  top:0;
  right:-340px;
  width:300px;
  height:100%;
  background:rgba(0,15,30,0.95);
  padding:15px;
  transition:.3s;
  overflow:auto;
  border-left:1px solid rgba(120,200,255,0.2);
}

.panel.open{right:0}

.section{
  font-size:12px;
  opacity:.7;
  margin-top:10px;
}

input{
  width:100%;
  margin-top:6px;
  background:rgba(0,0,0,0.3);
  color:#fff;
  border:1px solid rgba(120,200,255,0.2);
}

/* ボタン */
button{
  background:rgba(120,200,255,0.1);
  color:#dff6ff;
  border:1px solid rgba(120,200,255,0.2);
  padding:6px 10px;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="header">
  <h1>ONCE HUMAN</h1>
  <h2>GRAVITY ABYSS</h2>
</div>

<div class="container">

  <div style="flex:1" id="timerList"></div>

  <div style="flex:1">

    <div class="card" id="h1">
      空域ハンティング <span>0/12</span>
    </div>

    <div class="card" id="r1">
      スカイリッパー遺物 <span>0/10</span>
    </div>

    <div class="card" id="s1">
      スターコーリング <span>0/5</span>
    </div>

  </div>

</div>

<div class="settings" onclick="toggle()">⚙</div>

<div class="panel" id="panel">

  <button onclick="toggle()">戻る</button>

  <div class="section">背景URL</div>
  <input id="bg">
  <button onclick="setBg()">適用</button>

  <div class="section">ローカル背景</div>
  <input type="file" onchange="local(event)">

  <div class="section">透明度</div>
  <input type="range" min="0.3" max="0.9" step="0.01"
    oninput="setOpacity(this.value)">

  <div class="section">明るさ</div>
  <input type="range" min="0.5" max="1.5" step="0.01"
    oninput="setBright(this.value)">

</div>

<script>

/* ===== カウンター（簡略） ===== */
const val={h1:0,r1:0,s1:0};
const max={h1:12,r1:10,s1:5};

function updateCounter(){

  for(let k in val){
    const el=document.getElementById(k);

    el.classList.remove("max");

    if(val[k]>=max[k]){
      el.classList.add("max");
    }
  }
}

/* ===== タイマー ===== */
const events=[
 {name:"重力開始",m:22,s:30},
 {name:"スカイリッパー開始",m:37,s:30},
 {name:"重力終了",m:52,s:30},
 {name:"スカイリッパー終了",m:57,s:30}
];

function calc(){

  const now=new Date();

  let list=events.map(e=>{

    let t=new Date();
    t.setHours(now.getHours(),e.m,e.s,0);

    if(now>t) t.setDate(t.getDate()+1);

    let diff=t-now;

    return{
      name:e.name,
      sec:Math.floor(diff/1000),
      diff
    };
  });

  list.sort((a,b)=>a.diff-b.diff);

  render(list);
}

function render(list){

  const box=document.getElementById("timerList");
  box.innerHTML="";

  list.forEach((e,i)=>{

    let m=Math.floor(e.sec/60);
    let s=e.sec%60;

    let div=document.createElement("div");
    div.className="card";

    if(i===0) div.classList.add("big");

    // アラート（波紋強化）
    if(e.sec<120){
      div.classList.add("hot");
    }

    div.innerHTML=`
      <div class="ripple"></div>
      <div>
        ${e.name}
        <div>${m}:${s.toString().padStart(2,"0")}</div>
      </div>
    `;

    box.appendChild(div);
  });
}

setInterval(calc,1000);
calc();

/* ===== 設定 ===== */
function toggle(){
  document.getElementById("panel").classList.toggle("open");
}

function setBg(){
  document.body.style.backgroundImage=
    `url('${document.getElementById("bg").value}')`;
}

function local(e){
  const f=e.target.files[0];
  const r=new FileReader();
  r.onload=ev=>{
    document.body.style.backgroundImage=
      `url('${ev.target.result}')`;
  };
  r.readAsDataURL(f);
}

function setOpacity(v){
  document.documentElement.style.setProperty("--overlay",v);
}

function setBright(v){
  document.documentElement.style.setProperty("--brightness",v);
}

</script>

</body>
</html>
